<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCGX — Break vs Hold Exchange for Sealed TCG</title>
<meta name="description" content="Live Break vs Hold valuations, grading EV and market data for sealed Pokémon & One Piece products.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --ink:#0b0e1a;
  --ink2:#10142a;
  --panel:rgba(22,27,52,.62);
  --panel-solid:#161b34;
  --line:rgba(140,150,200,.14);
  --line-strong:rgba(140,150,200,.28);
  --text:#e7eaf6;
  --muted:#8a93b2;
  --up:#34d399;
  --down:#fb7185;
  --hold:#fbbf24;
  --grade:#818cf8;
  --foil:linear-gradient(100deg,#5eead4 0%,#818cf8 30%,#f0abb8 62%,#fcd34d 100%);
  --r:16px;
  --mono:'JetBrains Mono',monospace;
  --ui:'Sora',sans-serif;
  --disp:'Unbounded',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--ink);
  color:var(--text);
  font-family:var(--ui);
  font-size:14px;
  min-height:100vh;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(900px 600px at 85% -10%, rgba(129,140,248,.16), transparent 60%),
    radial-gradient(700px 500px at -10% 40%, rgba(94,234,212,.10), transparent 60%),
    radial-gradient(800px 700px at 60% 110%, rgba(240,171,184,.08), transparent 60%),
    var(--ink);
}
::selection{background:rgba(129,140,248,.4)}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font-family:inherit;color:var(--text)}
a{color:inherit}

/* ---------- Ticker ---------- */
.tickerbar{
  border-bottom:1px solid var(--line);
  background:rgba(11,14,26,.9);
  backdrop-filter:blur(8px);
  overflow:hidden;white-space:nowrap;
  font-family:var(--mono);font-size:12px;
  position:sticky;top:0;z-index:50;
}
.ticker-track{display:inline-block;padding:8px 0;animation:tick 55s linear infinite}
.tickerbar:hover .ticker-track{animation-play-state:paused}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tk{display:inline-flex;gap:8px;margin:0 22px;align-items:baseline}
.tk .sym{color:var(--muted);letter-spacing:.05em}
.tk .u{color:var(--up)} .tk .d{color:var(--down)}
@media (prefers-reduced-motion:reduce){
  .ticker-track{animation:none}
  *{transition:none!important}
}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:228px 1fr;max-width:1440px;margin:0 auto;min-height:calc(100vh - 34px)}
.side{
  border-right:1px solid var(--line);
  padding:22px 14px;
  position:sticky;top:34px;height:calc(100vh - 34px);
  display:flex;flex-direction:column;gap:4px;
}
.wordmark{font-family:var(--disp);font-weight:900;font-size:22px;letter-spacing:.02em;padding:0 10px 4px;position:relative;display:inline-block}
.wordmark small{font-family:var(--mono);font-weight:400;font-size:10px;color:var(--muted);display:block;letter-spacing:.24em;margin-top:2px}
.wordmark::after{content:"";position:absolute;left:10px;bottom:-2px;height:3px;width:52px;border-radius:2px;background:var(--foil)}
.navsec{margin-top:18px;font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--muted);padding:0 10px 6px}
.navbtn{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:10px 12px;border-radius:10px;font-size:13.5px;font-weight:500;color:var(--muted);
  transition:background .15s,color .15s;text-align:left;
}
.navbtn svg{width:16px;height:16px;flex:none;opacity:.8}
.navbtn:hover{background:rgba(140,150,200,.08);color:var(--text)}
.navbtn.active{background:rgba(129,140,248,.14);color:var(--text)}
.navbtn.active svg{opacity:1}
.side-foot{margin-top:auto;padding:12px 10px;font-size:11px;color:var(--muted);line-height:1.6}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--up);margin-right:6px;box-shadow:0 0 8px var(--up)}
.dot.demo{background:var(--hold);box-shadow:0 0 8px var(--hold)}

.main{padding:24px 28px 60px;min-width:0}
.topbar{display:flex;gap:14px;align-items:center;margin-bottom:22px;flex-wrap:wrap}
.search{
  flex:1;min-width:220px;display:flex;align-items:center;gap:10px;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;
  backdrop-filter:blur(10px);position:relative;
}
.search input{background:none;border:none;outline:none;width:100%;font-size:14px}
.search input::placeholder{color:var(--muted)}
.search svg{width:15px;height:15px;color:var(--muted);flex:none}
.search-results{
  position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:60;
  background:var(--panel-solid);border:1px solid var(--line-strong);border-radius:12px;
  max-height:320px;overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.5);display:none;
}
.search-results.open{display:block}
.sr-item{display:flex;justify-content:space-between;gap:10px;width:100%;padding:11px 14px;font-size:13px;border-bottom:1px solid var(--line);text-align:left}
.sr-item:last-child{border-bottom:none}
.sr-item:hover{background:rgba(129,140,248,.1)}
.sr-item .m{color:var(--muted);font-size:11.5px}
.pill{
  font-family:var(--mono);font-size:11px;padding:7px 12px;border-radius:999px;
  border:1px solid var(--line);color:var(--muted);background:rgba(22,27,52,.4)
}
.pill b{color:var(--text);font-weight:500}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:rgba(22,27,52,.4)}
.seg button{font-family:var(--mono);font-size:11px;padding:7px 13px;color:var(--muted);transition:all .15s}
.seg button.on{background:rgba(129,140,248,.18);color:#c3cbff}
.pill.acct{cursor:pointer;transition:all .15s}
.pill.acct:hover{color:var(--text);border-color:var(--line-strong)}

/* ---------- Panels / cards ---------- */
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-4{grid-template-columns:repeat(4,1fr)}
.panel{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  backdrop-filter:blur(14px);padding:18px 20px;
}
.panel h3{font-size:12px;font-family:var(--mono);font-weight:500;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel h3 .link{font-size:11px;letter-spacing:.05em;color:var(--grade);text-transform:none;cursor:pointer}
.stat .v{font-family:var(--mono);font-size:24px;font-weight:700;letter-spacing:-.01em}
.stat .lbl{color:var(--muted);font-size:12px;margin-top:4px}
.stat .chg{font-family:var(--mono);font-size:12px;margin-top:6px}
.pos{color:var(--up)} .neg{color:var(--down)} .neu{color:var(--hold)}

h1.pagetitle{font-family:var(--disp);font-weight:700;font-size:24px;margin-bottom:4px}
.pagesub{color:var(--muted);margin-bottom:22px;font-size:13.5px;max-width:640px;line-height:1.6}

/* ---------- Tables ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-strong);font-weight:500}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.rowlink{cursor:pointer;transition:background .12s}
tr.rowlink:hover{background:rgba(129,140,248,.07)}
td.num,th.num{text-align:right;font-family:var(--mono)}
.prodname{font-weight:600}
.prodmeta{color:var(--muted);font-size:11.5px;margin-top:2px}
.badge{font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:6px;letter-spacing:.06em}
.badge.break{background:rgba(52,211,153,.14);color:var(--up)}
.badge.hold{background:rgba(251,191,36,.14);color:var(--hold)}
.badge.grade{background:rgba(129,140,248,.16);color:#a5b0ff}
.badge.game{background:rgba(140,150,200,.12);color:var(--muted)}
.hotdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--foil);margin-left:6px;animation:hot 1.6s ease-in-out infinite}
@keyframes hot{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.35);opacity:.5}}
.spark{width:110px;height:30px;display:block}

/* ---------- Verdict dial ---------- */
.dialwrap{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0 2px}
.dial{width:230px;height:130px;position:relative}
.dial svg{width:100%;height:100%;overflow:visible}
.dial-needle{transform-origin:115px 118px;transition:transform 1s cubic-bezier(.22,1.4,.36,1)}
.verdict-word{
  font-family:var(--disp);font-weight:900;font-size:30px;letter-spacing:.04em;
  background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(129,140,248,.35));
}
.verdict-sub{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;line-height:1.7}
.verdict-sub b{color:var(--text)}

/* ---------- Forms / controls ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.field input,.field select{
  background:rgba(11,14,26,.6);border:1px solid var(--line-strong);border-radius:10px;
  padding:10px 12px;font-size:14px;outline:none;font-family:var(--mono);width:100%;
}
.field input:focus,.field select:focus{border-color:var(--grade)}
.field select option{background:var(--panel-solid)}
.rangefield{display:grid;grid-template-columns:1fr 64px;gap:10px;align-items:center}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:rgba(140,150,200,.25);outline:none;width:100%}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--grade);cursor:pointer;box-shadow:0 0 10px rgba(129,140,248,.6)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 18px;border-radius:11px;font-weight:600;font-size:13.5px;
  background:rgba(129,140,248,.16);border:1px solid rgba(129,140,248,.4);color:#c3cbff;
  transition:all .15s;
}
.btn:hover{background:rgba(129,140,248,.26)}
.btn.foil{background:var(--foil);color:#0b0e1a;border:none;font-weight:700}
.btn.foil:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border:1px solid var(--line-strong);color:var(--muted)}
.btn.ghost:hover{color:var(--text)}
.btn.sm{padding:7px 12px;font-size:12px;border-radius:9px}
.btn.danger{background:rgba(251,113,133,.12);border-color:rgba(251,113,133,.35);color:var(--down)}

/* ---------- News ---------- */
.news-item{display:grid;grid-template-columns:86px 1fr;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.news-item:last-child{border-bottom:none}
.news-time{font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.7}
.news-title{font-weight:600;font-size:14.5px;line-height:1.45;margin-bottom:5px}
.news-body{color:var(--muted);font-size:13px;line-height:1.65}
.news-tags{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.tagchip{font-family:var(--mono);font-size:10px;padding:3px 9px;border-radius:6px;background:rgba(140,150,200,.1);color:var(--muted);border:none;cursor:pointer}
.tagchip.on,.tagchip:hover{background:rgba(129,140,248,.18);color:#c3cbff}

/* ---------- Break simulator ---------- */
.packgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-top:14px}
.pull{
  border-radius:10px;border:1px solid var(--line);padding:10px 8px;text-align:center;
  font-size:11px;background:rgba(11,14,26,.5);animation:pop .35s cubic-bezier(.2,1.6,.4,1) backwards;
}
.pull .pr{font-family:var(--mono);font-size:12px;margin-top:4px}
.pull.hit{border-color:transparent;background:
  linear-gradient(rgba(16,20,42,.88),rgba(16,20,42,.88)) padding-box,
  var(--foil) border-box;box-shadow:0 0 22px rgba(129,140,248,.28)}
.pull.hit .pr{color:#fcd34d}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.simscore{font-family:var(--mono);font-size:15px;margin-top:16px;line-height:1.9}

/* ---------- Detail view ---------- */
.backlink{color:var(--muted);font-size:13px;margin-bottom:14px;display:inline-flex;gap:6px;align-items:center}
.backlink:hover{color:var(--text)}
.detail-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}
.detail-price{font-family:var(--mono);font-size:34px;font-weight:700}
.chart-tabs{display:flex;gap:6px}
.chart-tabs button{font-family:var(--mono);font-size:11px;padding:5px 10px;border-radius:8px;color:var(--muted)}
.chart-tabs button.on{background:rgba(129,140,248,.16);color:#c3cbff}
.evbar{height:12px;border-radius:6px;background:rgba(140,150,200,.14);overflow:hidden;display:flex;margin:8px 0 4px}
.evbar div{height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}

.qm{
  display:inline-flex;align-items:center;justify-content:center;
  width:15px;height:15px;border-radius:50%;flex:none;
  border:1px solid var(--line-strong);color:var(--muted);
  font-family:var(--mono);font-size:9.5px;font-weight:700;line-height:1;
  margin-left:6px;vertical-align:1px;cursor:help;transition:all .15s;
}
.qm:hover{color:#c3cbff;border-color:var(--grade);background:rgba(129,140,248,.12)}
.hintpop{
  position:fixed;z-index:200;display:none;
  background:var(--panel-solid);border:1px solid var(--line-strong);border-radius:14px;
  padding:14px 16px;box-shadow:0 18px 50px rgba(0,0,0,.55);
}
.hintpop.open{display:block;animation:hintin .16s ease-out}
@keyframes hintin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.hintpop .hp-t{font-weight:700;font-size:13px;margin-bottom:6px;background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.hintpop .hp-b{color:var(--muted);font-size:12.5px;line-height:1.65}
.hintpop .hp-b b{color:var(--text);font-weight:600}

.empty{padding:40px 20px;text-align:center;color:var(--muted);line-height:1.8;font-size:13.5px}
.badge.nodata{background:rgba(140,150,200,.1);color:var(--muted)}
.src{font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:5px;margin-left:6px;letter-spacing:.05em}
.src.live{background:rgba(52,211,153,.12);color:var(--up)}
.src.est{background:rgba(251,191,36,.12);color:var(--hold)}
.desk-row{display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.desk-row:last-child{border-bottom:none}
.desk-row input{background:rgba(11,14,26,.6);border:1px solid var(--line-strong);border-radius:9px;padding:8px 10px;font-family:var(--mono);font-size:13px;outline:none;width:100%}
.desk-row input:focus{border-color:var(--grade)}
.desk-note{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:14px}
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--panel-solid);border:1px solid var(--line-strong);border-radius:12px;
  padding:12px 20px;font-size:13.5px;z-index:100;transition:transform .3s;box-shadow:0 12px 40px rgba(0,0,0,.5)
}
.toast.show{transform:translateX(-50%) translateY(0)}

@media (max-width:1000px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:none;border-bottom:1px solid var(--line);padding:14px}
  .navsec{display:none}
  .navbtn{width:auto;padding:8px 11px}
  .navbtn span{display:none}
  .side-foot{display:none}
  .g-2,.g-3,.g-4{grid-template-columns:1fr}
  .main{padding:18px 14px 60px}
  .spark{width:70px}
}
</style>
</head>
<body>

<div class="tickerbar"><div class="ticker-track" id="ticker"></div></div>

<div class="shell">
  <aside class="side">
    <div class="wordmark">TCGX<small>BREAK · HOLD · GRADE</small></div>
    <div class="navsec">TERMINAL</div>
    <button class="navbtn active" data-view="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span>Dashboard</span></button>
    <button class="navbtn" data-view="markets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg><span>Markets</span></button>
    <button class="navbtn" data-view="engine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg><span>Break vs Hold</span></button>
    <button class="navbtn" data-view="grading"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.9 6.3 6.6.6-5 4.5 1.5 6.6L12 16.8 6 20l1.5-6.6-5-4.5 6.6-.6z"/></svg><span>Grading Lab</span></button>
    <button class="navbtn" data-view="simulator"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.4" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.4" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.4" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.4" fill="currentColor"/></svg><span>Break Simulator</span></button>
    <div class="navsec">DESK</div>
    <button class="navbtn" data-view="watchlist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg><span>Watchlist</span></button>
    <button class="navbtn" data-view="portfolio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg><span>Portfolio</span></button>
    <button class="navbtn" data-view="datadesk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span>Data desk</span></button>
    <button class="navbtn" data-view="news"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-4 0V6"/><path d="M12 6h6M12 10h6M12 14h6M12 18h6"/></svg><span>News Wire</span></button>
    <div class="side-foot">
      <div id="datasource"><span class="dot demo"></span>Connecting…</div>
      <div id="datasource-sub" style="margin-top:6px">Real recorded data only — nothing simulated.</div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="searchbox" placeholder="Search sets, cases, booster boxes… (e.g. Prismatic, OP-05)" autocomplete="off">
        <div class="search-results" id="searchresults"></div>
      </div>
      <div class="seg" id="gameseg">
        <button data-game="All" class="on">All</button>
        <button data-game="Pokémon">Pokémon</button>

function agoStr(d){
  if(!d) return "";
  const t = new Date(String(d).replace(" ","T") + (String(d).includes("Z")?"":"Z"));
  const m = (Date.now()-t)/60000;
  if(!(m>=0)) return "";
  if(m<60) return Math.max(1,Math.round(m))+"m";
  if(m<1440) return Math.round(m/60)+"h";
  return Math.round(m/1440)+"d";
}

async function loadLive(){
  LIVE = { ok:false, err:null, prices:{}, hist:{}, cards:{}, news:[] };
  try{
    const r = await fetch(API_BASE + "/api/bootstrap");
    if(!r.ok) throw new Error("API " + r.status);
    const d = await r.json();
    (d.products||[]).forEach(x=>{ if(x.market_price_usd!=null) LIVE.prices[x.id] = {v:+x.market_price_usd, at:x.recorded_at}; });
    Object.entries(d.history||{}).forEach(([id,rows])=>{
      LIVE.hist[id] = rows.map(x=>({d:String(x.d).slice(0,10), v:+x.v}));
    });
    (d.cards||[]).forEach(c=>{
      LIVE.cards[c.set_id+"|"+c.name] = { v: c.live_price!=null? +c.live_price : null, at: c.price_at||null };
    });
    LIVE.news = (d.news||[]).map(n=>({t:n.title, b:n.body||"", u:n.url||"", tags:(n.tags||"").split(",").map(s=>s.trim()).filter(Boolean), ago:agoStr(n.published_at)}));

/* ---------- Real-data accessors (null = honestly unknown) ---------- */
const price = p => LIVE.prices[p.id] ? LIVE.prices[p.id].v : null;
const histOf = id => LIVE.hist[id] || [];
function chgPct(p, days){
  const h = histOf(p.id);
  if(h.length < 2) return null;
  const now = h[h.length-1];
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-days);
  const cut = cutoff.toISOString().slice(0,10);
  const past = [...h].reverse().find(x=>x.d <= cut);
  if(!past || past.v===0) return null;
  return (now.v/past.v - 1)*100;
}
function cardVal(setId, c){
  const live = LIVE.cards[setId+"|"+c.name];
  if(live && live.v!=null) return {v:live.v, live:true, at:live.at};
  return {v:c.est, live:false, at:null};
}
function setHasEst(setId){ return (CARDS[setId]||[]).some(c=>!cardVal(setId,c).live); }

/* ---------- Valuation (EV real where prices are real; EST labelled) ---------- */
function evPerPack(setId){
  return (CARDS[setId]||[]).reduce((s,c)=>s + c.rate*cardVal(setId,c).v, 0) + FILLER_PER_PACK;
}
function gradeUpliftPerPack(setId, gfee=GRADE_FEE){
  return (CARDS[setId]||[]).reduce((s,c)=>{
    const raw = cardVal(setId,c).v;
    if(raw < 100 || !c.psa10) return s;
    const gradeEV = c.gem*c.psa10 + (1-c.gem)*raw*0.75 - gfee;
    return s + c.rate * Math.max(0, gradeEV - raw);
  },0);
}
function valuation(p){
  const mkt = price(p);
  const rawBreak = evPerPack(p.set) * p.packs;
  const netBreak = rawBreak * (1-SELL_FEES);
  const gradedBreak = (evPerPack(p.set) + gradeUpliftPerPack(p.set)) * p.packs * (1-SELL_FEES);
  const c365 = chgPct(p, 365);
  if(mkt == null){
    return {mkt:null, rawBreak, netBreak, gradedBreak, cagr:c365, breakROI:null, gradeROI:null, verdict:"NO DATA", est:setHasEst(p.set)};
  }
  const breakROI = (netBreak/mkt - 1) * 100;
  const gradeROI = (gradedBreak/mkt - 1) * 100;
  let verdict = "HOLD";
  if(gradeROI > 12 && gradeROI > breakROI + 5) verdict = "GRADE";
  else if(breakROI > 8) verdict = "BREAK";
  return {mkt, rawBreak, netBreak, gradedBreak, cagr:c365, breakROI, gradeROI, verdict, est:setHasEst(p.set)};
}
function heat(p){
  const m7 = chgPct(p,7), m30 = chgPct(p,30);
  if(m7==null && m30==null) return null;
  return Math.max(0, Math.min(100, Math.round(50 + (m7||0)*4 + (m30||0)*1.2)));
}

function indexSeries(list){
  const L = (list && list.length ? list : PRODUCTS).filter(p=>histOf(p.id).length>=2);
  if(L.length===0) return [];
  const dates = [...new Set(L.flatMap(p=>histOf(p.id).map(x=>x.d)))].sort();
  if(dates.length<2) return [];
  return dates.map(d=>{
    let sum=0, n=0;
    L.forEach(p=>{
      const h = histOf(p.id);
      const pt = [...h].reverse().find(x=>x.d<=d);
      if(pt && h[0].v>0){ sum += pt.v/h[0].v; n++; }
    });
    return {d, v: n? +(100*sum/n).toFixed(2) : 100};
  });
}

let fbUser = null, fbDb = null;
function initAuth(){
  const btn = document.getElementById("acctbtn");
  if(!FIREBASE_CONFIG){ btn.onclick = () => toast("Login isn't set up — see FIREBASE_CONFIG in index.html"); return; }
  if(typeof firebase === "undefined"){ btn.onclick = () => toast("Firebase scripts didn't load — check ad-blocker and refresh"); return; }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    fbDb = firebase.firestore();
  }catch(e){ btn.onclick = () => toast("Firebase config error: " + e.message); console.error(e); return; }
  firebase.auth().getRedirectResult().catch(e=>toast("Sign-in: " + e.message));
  firebase.auth().onAuthStateChanged(async u=>{
    fbUser = u;
    btn.textContent = u ? ((u.displayName||"Account").split(" ")[0] + " · Sign out") : "Sign in";
    if(u){ await cloudLoad(); render(); }
  });
  btn.onclick = ()=>{
    if(fbUser){ firebase.auth().signOut(); return; }
    toast("Opening Google sign-in…");
    const prov = new firebase.auth.GoogleAuthProvider();
    firebase.auth().signInWithPopup(prov).catch(e=>{
      console.error("sign-in:", e);
      const popupIssue = e && ["auth/popup-blocked","auth/cancelled-popup-request","auth/operation-not-supported-in-this-environment"].includes(e.code);
      if(popupIssue) firebase.auth().signInWithRedirect(prov).catch(err=>toast("Sign-in failed: " + err.message));
      else if(e.code !== "auth/popup-closed-by-user") toast("Sign-in failed: " + (e.message||e.code));
    });
  };
}
async function cloudLoad(){
  try{
    const snap = await fbDb.collection("users").doc(fbUser.uid).get();
    if(snap.exists){
      const d = snap.data();
      if(Array.isArray(d.watch)) store.set("tcgx.watch", d.watch);
      if(Array.isArray(d.port))  store.set("tcgx.port",  d.port);
      toast("Profile loaded");
    } else { cloudSave(); toast("Profile created"); }
  }catch(e){}
}
function cloudSave(){
  if(!fbUser || !fbDb) return;
  fbDb.collection("users").doc(fbUser.uid).set({
    watch: store.get("tcgx.watch",[]),
    port:  store.get("tcgx.port",[]),
    updated: new Date().toISOString()
  }).catch(()=>{});
}

  let x = Math.min(Math.max(12, r.left + r.width/2 - w/2), window.innerWidth - w - 12);
  el.style.left = x + "px";
  const hh = el.offsetHeight;
  let y = r.bottom + 8;
  if(y + hh > window.innerHeight - 12) y = r.top - hh - 8;
  el.style.top = Math.max(12, y) + "px";
}

function sparkline(p){
  const h = histOf(p.id).slice(-30).map(x=>x.v);
  if(h.length < 2) return '<span class="prodmeta">—</span>';
  const min=Math.min(...h), max=Math.max(...h), rng=(max-min)||1;
  const pts = h.map((v,i)=>`${(i/(h.length-1)*110).toFixed(1)},${(28-(v-min)/rng*24+1).toFixed(1)}`).join(" ");
  const up = h[h.length-1]>=h[0];
  return `<svg class="spark" viewBox="0 0 110 30" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${up?'#34d399':'#fb7185'}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}

function runEngine(){
  const p = prodOf($("#eng-prod").value); if(!p) return;
  const fee = +$("#eng-fee").value/100;
  const gfee = +$("#eng-gfee").value;
  const mkt = price(p);
  const buyin = +$("#eng-buyin").value || mkt;
  if(!buyin){ $("#eng-out").innerHTML = '<div class="empty">This product has no recorded market price yet — enter your buy-in above (or record a price in the Data desk).</div>'; return; }
  const ev = evPerPack(p.set);
  const uplift = gradeUpliftPerPack(p.set, gfee);
  const netBreak = ev*p.packs*(1-fee);
  const gradedBreak = (ev+uplift)*p.packs*(1-fee);
  const breakROI = (netBreak/buyin-1)*100;
  const gradeROI = (gradedBreak/buyin-1)*100;
  let verdict="HOLD";
  if(gradeROI>12 && gradeROI>breakROI+5) verdict="GRADE";
  else if(breakROI>8) verdict="BREAK";
  $("#eng-out").innerHTML = dialHTML({breakROI, verdict}) + `<div class="verdict-sub">
    At a buy-in of <b>${fmt(buyin)}</b>:<br>
    Break net: <b>${fmt(netBreak)}</b>${estTag(setHasEst(p.set))} (<b class="${cls(breakROI)}">${pct(breakROI)}</b>)<br>
    Break + grade: <b>${fmt(gradedBreak)}</b> (<b class="${cls(gradeROI)}">${pct(gradeROI)}</b>)</div>`;
}

function runGrading(){
  const raw=+$("#gr-raw").value, p10=+$("#gr-psa10").value;
  const p9 = +$("#gr-psa9").value || raw*0.75;
  const gem=+$("#gr-gem").value/100, fee=+$("#gr-fee").value;
  const ev = gem*p10 + (1-gem)*p9 - fee;
  const edge = ev-raw;
  const be = (raw+fee-p9)/(p10-p9);
  const verdict = edge>raw*0.1 ? "GRADE" : edge>0 ? "MARGINAL" : "SELL RAW";
  $("#gr-out").innerHTML = `
  <div class="dialwrap"><div class="verdict-word">${verdict}</div></div>
  <div class="verdict-sub">
    Expected value graded: <b>${fmt2(ev)}</b> vs raw <b>${fmt2(raw)}</b><br>
    Edge per card: <b class="${cls(edge)}">${(edge>=0?"+":"\u2212")+fmt2(Math.abs(edge))}</b> (${pct(edge/raw*100)})<br>
    Break-even gem rate: <b>${(Math.max(0,Math.min(1,be))*100).toFixed(0)}%</b> — you assume <b>${(gem*100).toFixed(0)}%</b> ${hint("breakeven")}
  </div>`;
}

  for(let i=0;i<p.packs;i++){
    let best=null;
    cards.forEach(c=>{ if(Math.random()<c.rate){ const cv=cardVal(p.set,c); if(!best||cv.v>best.v) best={name:c.name, v:cv.v, live:cv.live}; } });
    if(best){ pulls.push(best); hitValue+=best.v; }
  }
  const total = hitValue + FILLER_PER_PACK*p.packs;
  const net = total*(1-SELL_FEES);
  const cost = price(p);
  const roi = cost? (net/cost-1)*100 : null;
  pulls.sort((a,b)=>b.v-a.v);
  const shown = pulls.slice(0,24);
  $("#sim-out").innerHTML = `
    <div class="packgrid">${shown.length?shown.map((c,i)=>`<div class="pull ${c.v>=100?'hit':''}" style="animation-delay:${i*45}ms"><div>${c.name}</div><div class="pr">${fmt(c.v)}</div></div>`).join(""):'<div class="empty" style="grid-column:1/-1">Nothing but bulk this time. That, right there, is variance.</div>'}</div>
    ${pulls.length>24?`<div class="prodmeta" style="margin-top:8px">+ ${pulls.length-24} smaller hits not shown</div>`:""}
    <div class="simscore">
      Hits: <b>${pulls.length}</b> · Hit value: <b>${fmt(Math.round(hitValue))}</b> · With bulk: <b>${fmt(Math.round(total))}</b><br>
      Net after fees: <b>${fmt(Math.round(net))}</b>${cost?` vs cost <b>${fmt(cost)}</b> → this break: <b class="${cls(roi)}">${pct(roi)}</b>`:` · no recorded cost to compare against yet`}
    </div>`;
}
function updateSimInfo(){
  const el = $("#sim-info"); if(!el) return;
  const p = prodOf($("#sim-prod").value); if(!p){ el.innerHTML=""; return; }
  const v = valuation(p);
  el.innerHTML = `Box price <b style="color:var(--text)">${fmt(v.mkt)}</b> · Net break value <b style="color:var(--text)">${fmt(v.netBreak)}</b>${estTag(v.est)} ${v.breakROI!=null?`(${pct(v.breakROI)})`:""} · ${vBadge(v.verdict)} — one rip can land far from the average.`;
}

/* ---------- Data desk (real observations in, admin key required to save) ---------- */
function vDataDesk(){
  const prodRows = PRODUCTS.map(p=>{
    const cur = LIVE.prices[p.id];
    return `<div class="desk-row">
      <div><div class="prodname" style="font-weight:500">${setOf(p.set).name} — ${p.name}</div>
      <div class="prodmeta">${cur?`latest ${fmt(cur.v)} · ${String(cur.at).slice(0,10)}`:"no price recorded yet"}</div></div>
      <input type="number" step="0.01" min="0" placeholder="${cur?cur.v:"USD"}" data-deskprod="${p.id}">
    </div>`;
  }).join("");
  const cardRows = Object.entries(CARDS).map(([setId,list])=>{
    const s = setOf(setId);
    return `<div class="prodmeta" style="margin:14px 0 4px;font-weight:600;color:var(--text)">${s.name}</div>` +
      list.map(c=>{
        const cv = cardVal(setId,c);
        return `<div class="desk-row">
          <div><div style="font-size:13px">${c.name}<span class="src ${cv.live?'live':'est'}">${cv.live?'LIVE':'EST'}</span></div>
          <div class="prodmeta">${cv.live?`recorded ${fmt(cv.v)}${cv.at?" · "+String(cv.at).slice(0,10):""}`:`estimate ${fmt(c.est)} — replace with a real observed price`}</div></div>
          <input type="number" step="0.01" min="0" placeholder="${cv.v}" data-deskcard="${setId}|${c.name}">
        </div>`;
      }).join("");
  }).join("");
  return `
  <h1 class="pagetitle">Data desk ${hint("datadesk")}</h1>
  <p class="pagesub">This is where real numbers enter the system. Type prices you actually observe (eBay solds, Cardmarket, your distributor) and save — each save is written to your database with a timestamp and becomes live data and permanent history. Only fill the fields you want to update.</p>
  <div class="panel" style="margin-bottom:16px">
    <h3>Admin key</h3>
    <div class="desk-note">Required to save. It's checked by the server (the same ADMIN_KEY secret on your Worker) — visitors without it can't write anything. Held in memory only, never stored in the page.</div>
    <input type="password" id="desk-key" placeholder="Paste your ADMIN_KEY" value="${adminKey?"••••••••":""}" style="background:rgba(11,14,26,.6);border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;font-family:var(--mono);width:100%;outline:none">
  </div>
  <div class="grid g-2">
    <div class="panel">
      <h3>Sealed product prices (USD)</h3>
      ${prodRows}
      <button class="btn foil" id="desk-save-prods" style="width:100%;margin-top:14px">Save sealed prices</button>
    </div>
    <div class="panel">
      <h3>Card prices (USD)</h3>
      <div class="desk-note">English Pokémon chase cards are refreshed nightly from TCGplayer market data automatically. Japanese and One Piece have no free feed — your observed prices here are the real source.</div>
      ${cardRows}
      <button class="btn foil" id="desk-save-cards" style="width:100%;margin-top:14px">Save card prices</button>
    </div>
  </div>
  <div class="panel" style="margin-top:16px">
    <h3>Post a headline</h3>
    <div class="desk-note">Nightly job pulls real PokéBeach articles automatically. You can also post your own (restocks you've seen, market observations).</div>
    <div class="field"><label>Title</label><input id="desk-news-t" type="text"></div>
    <div class="field"><label>Link (optional)</label><input id="desk-news-u" type="text" placeholder="https://…"></div>
    <div class="field"><label>Body (optional)</label><input id="desk-news-b" type="text"></div>
    <div class="field"><label>Tags (comma separated)</label><input id="desk-news-tags" type="text" placeholder="Pokémon, Sealed"></div>
    <button class="btn" id="desk-save-news">Publish headline</button>
  </div>`;
}
function deskKey(){
  const el = $("#desk-key");
  if(el && el.value && el.value !== "••••••••") adminKey = el.value.trim();
  return adminKey;
}
async function deskPost(path, body){
  const key = deskKey();
  if(!key){ toast("Paste your ADMIN_KEY first"); return false; }
  try{
    const r = await fetch(API_BASE + path, {
      method:"POST",
      headers:{ "Content-Type":"application/json", "Authorization":"Bearer " + key },
      body: JSON.stringify(body)
    });
    if(r.status===401){ toast("Wrong admin key — server rejected the save"); return false; }
    if(!r.ok){ toast("Save failed: " + r.status); return false; }
    return true;
  }catch(e){ toast("Save failed: " + e.message); return false; }
}
async function deskSaveProducts(){
  const rows = [...document.querySelectorAll("[data-deskprod]")]
    .filter(i=>i.value!=="" && +i.value>0)
    .map(i=>({item_id:i.dataset.deskprod, market_price_usd:+i.value}));
  if(!rows.length){ toast("No prices entered"); return; }
  if(await deskPost("/api/prices", rows)){ toast(`Saved ${rows.length} real price${rows.length>1?"s":""}`); loadLive(); go("datadesk"); }
}
async function deskSaveCards(){
  const rows = [...document.querySelectorAll("[data-deskcard]")]
    .filter(i=>i.value!=="" && +i.value>0)
    .map(i=>({item_id:"card|"+i.dataset.deskcard, market_price_usd:+i.value}));
  if(!rows.length){ toast("No prices entered"); return; }
  if(await deskPost("/api/prices", rows)){ toast(`Saved ${rows.length} card price${rows.length>1?"s":""}`); loadLive(); go("datadesk"); }
}
async function deskSaveNews(){
  const t = $("#desk-news-t").value.trim();
  if(!t){ toast("Title required"); return; }
  const body = { title:t, url:$("#desk-news-u").value.trim(), body:$("#desk-news-b").value.trim(), tags:$("#desk-news-tags").value.trim() };
  if(await deskPost("/api/news", body)){ toast("Headline published"); loadLive(); go("news"); }
}

/* ---------- Watchlist / Portfolio ---------- */
function isWatched(id){ return store.get("tcgx.watch",[]).includes(id); }
function toggleWatch(id){
  let w = store.get("tcgx.watch",[]);
  w = w.includes(id) ? w.filter(x=>x!==id) : [...w,id];
  store.set("tcgx.watch",w);
  toast(w.includes(id)?"Added to watchlist":"Removed from watchlist");
  render();
}
function vWatchlist(){
  const w = store.get("tcgx.watch",[]).map(prodOf).filter(Boolean);
  if(!w.length) return `<h1 class="pagetitle">Watchlist</h1><div class="panel"><div class="empty">Nothing watched yet. Hit the ☆ on any product in <b>Markets</b> and it lands here with live verdict tracking.</div></div>`;
  return `
  <h1 class="pagetitle">Watchlist</h1>
  <p class="pagesub">Your shortlist with the current verdict from recorded data.</p>
  <div class="panel" style="overflow-x:auto"><table>
    <thead><tr><th>Product</th><th class="num">Market</th><th class="num">7d</th><th class="num">Break ROI</th><th>30d</th><th class="num">Verdict</th><th></th></tr></thead><tbody>
    ${w.map(p=>{const v=valuation(p);return `<tr class="rowlink" data-prod="${p.id}">
      <td><div class="prodname">${setOf(p.set).name}</div><div class="prodmeta">${p.name}</div></td>
      <td class="num">${fmt(v.mkt)}</td><td class="num ${cls(chgPct(p,7))}">${pct(chgPct(p,7))}</td>
      <td class="num ${cls(v.breakROI)}">${pct(v.breakROI)}</td><td>${sparkline(p)}</td>
      <td class="num">${vBadge(v.verdict)}</td>
      <td class="num"><button class="btn ghost sm" data-watch="${p.id}">★</button></td></tr>`;}).join("")}
  </tbody></table></div>`;
}
function vPortfolio(){
  const port = store.get("tcgx.port",[]);
  const opts = PRODUCTS.map(p=>`<option value="${p.id}">${setOf(p.set).name} — ${p.name}</option>`).join("");
  let rows="", totCost=0, totVal=0, anyUnpriced=false;
  port.forEach((hd,i)=>{
    const p=prodOf(hd.id); if(!p) return;
    const mp = price(p);
    const val = mp!=null ? mp*hd.qty : null;
    const cost = hd.cost*hd.qty;
    totCost+=cost; if(val!=null) totVal+=val; else anyUnpriced=true;
    const pl = val!=null&&cost>0 ? (val/cost-1)*100 : null;
    rows+=`<tr class="rowlink" data-prod="${p.id}">
      <td><div class="prodname">${setOf(p.set).name}</div><div class="prodmeta">${p.name}</div></td>
      <td class="num">${hd.qty}</td><td class="num">${fmt(hd.cost)}</td><td class="num">${fmt(mp)}</td>
      <td class="num">${val!=null?fmt(Math.round(val)):"—"}</td><td class="num ${cls(pl)}">${pct(pl)}</td>
      <td class="num"><button class="btn danger sm" data-delport="${i}">✕</button></td></tr>`;
  });
  const totPL = totCost&&!anyUnpriced? (totVal/totCost-1)*100 : null;
  return `
  <h1 class="pagetitle">Portfolio</h1>
  <p class="pagesub">Your actual sealed positions against the latest recorded market values.</p>
  <div class="grid g-3" style="margin-bottom:16px">
    <div class="panel stat"><div class="v">${anyUnpriced?"—":fmt(Math.round(totVal))}</div><div class="lbl">Market value${anyUnpriced?" (some positions unpriced)":""}</div></div>
    <div class="panel stat"><div class="v">${fmt(Math.round(totCost))}</div><div class="lbl">Cost basis</div></div>
    <div class="panel stat"><div class="v ${cls(totPL)}">${pct(totPL)}</div><div class="lbl">Unrealised P/L ${hint("pl")}</div></div>
  </div>
  <div class="panel" style="margin-bottom:16px">
    <h3>Add position</h3>
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">
      <div class="field" style="flex:2;min-width:220px;margin:0"><label>Product</label><select id="pf-prod">${opts}</select></div>
      <div class="field" style="width:110px;margin:0"><label>Qty</label><input type="number" id="pf-qty" value="1" min="1"></div>
      <div class="field" style="width:150px;margin:0"><label>Cost each (USD)</label><input type="number" id="pf-cost" value="0" min="0"></div>
      <button class="btn" id="pf-add">Add</button>
    </div>
  </div>
  ${port.length?`<div class="panel" style="overflow-x:auto"><table>
    <thead><tr><th>Product</th><th class="num">Qty</th><th class="num">Cost</th><th class="num">Market</th><th class="num">Value</th><th class="num">P/L</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table></div>`
  :`<div class="panel"><div class="empty">No positions yet. Add your sealed inventory above to see live P/L.</div></div>`}`;
}

function vNews(activeTag){
  if(!LIVE.news.length) return `
  <h1 class="pagetitle">News wire</h1>
  <div class="panel"><div class="empty">No headlines yet — and no fake ones, ever.<br>The nightly job pulls real PokéBeach articles into your database, and you can publish your own observations from the Data desk.</div></div>`;
  const tags=[...new Set(LIVE.news.flatMap(n=>n.tags))];
  const list = LIVE.news.filter(n=>!activeTag||n.tags.includes(activeTag));
  return `
  <h1 class="pagetitle">News wire</h1>
  <p class="pagesub">Real headlines from your database — pulled nightly from PokéBeach or posted by you. Titles link to the original source.</p>
  <div class="news-tags" style="margin-bottom:16px">
    <button class="tagchip ${!activeTag?'on':''}" data-tag="">All</button>
    ${tags.map(t=>`<button class="tagchip ${t===activeTag?'on':''}" data-tag="${t}">${t}</button>`).join("")}
  </div>
  <div class="panel">
    ${list.map(n=>`<div class="news-item"><div class="news-time">${n.ago?n.ago+" ago":""}</div><div>
      <div class="news-title">${n.u?`<a href="${n.u}" target="_blank" rel="noopener">${n.t} ↗</a>`:n.t}</div>${n.b?`<div class="news-body">${n.b}</div>`:""}
      ${n.tags.length?`<div class="news-tags">${n.tags.map(t=>`<button class="tagchip" data-tag="${t}">${t}</button>`).join("")}</div>`:""}
    </div></div>`).join("")}
  </div>`;
}

/* ---------- Charts ---------- */
Chart.defaults.color = "#8a93b2";
Chart.defaults.font.family = "'JetBrains Mono', monospace";
Chart.defaults.font.size = 10.5;
function lineChart(el, labels, data, color){
  const ctx = document.getElementById(el); if(!ctx) return;
  const g = ctx.getContext("2d").createLinearGradient(0,0,0,ctx.height||200);
  g.addColorStop(0, color.replace(")",",.22)").replace("rgb","rgba"));
  g.addColorStop(1, "rgba(0,0,0,0)");
  charts.push(new Chart(ctx,{type:"line",data:{labels,datasets:[{data,borderColor:color,backgroundColor:g,fill:true,tension:.3,pointRadius:2,borderWidth:1.8}]},
    options:{responsive:true,plugins:{legend:{display:false},tooltip:{mode:"index",intersect:false,backgroundColor:"#161b34",borderColor:"rgba(140,150,200,.3)",borderWidth:1}},
    scales:{x:{grid:{display:false},ticks:{maxTicksLimit:6}},y:{grid:{color:"rgba(140,150,200,.08)"},ticks:{maxTicksLimit:5}}},interaction:{mode:"index",intersect:false}}}));
}

/* ---------- Router ---------- */
let newsTag = "";
function render(){
  killCharts();
  IDX = indexSeries(filtered());
  document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active", b.dataset.view===currentView));
  if(currentView==="dashboard") viewEl.innerHTML = vDashboard();
  else if(currentView==="markets") viewEl.innerHTML = vMarkets();
  else if(currentView==="detail") viewEl.innerHTML = vDetail(detailId);
  else if(currentView==="engine"){ viewEl.innerHTML = vEngine(); runEngine(); }
  else if(currentView==="grading"){ viewEl.innerHTML = vGrading(); runGrading(); }
  else if(currentView==="simulator"){ viewEl.innerHTML = vSimulator(detailId); updateSimInfo(); }
  else if(currentView==="datadesk") viewEl.innerHTML = vDataDesk();
  else if(currentView==="watchlist") viewEl.innerHTML = vWatchlist();
  else if(currentView==="portfolio") viewEl.innerHTML = vPortfolio();
  else if(currentView==="news") viewEl.innerHTML = vNews(newsTag);

  if(currentView==="dashboard" && IDX.length>=2) lineChart("idxchart", IDX.map(x=>x.d.slice(5)), IDX.map(x=>x.v), "rgb(129,140,248)");
  if(currentView==="detail" && prodOf(detailId)){
    const h = histOf(detailId);
    if(h.length>=2) lineChart("detchart", h.map(x=>x.d.slice(5)), h.map(x=>x.v), (chgPct(prodOf(detailId),30)??0)>=0?"rgb(52,211,153)":"rgb(251,113,133)");
  }
  window.scrollTo({top:0});
}
function go(view, id){ currentView=view; detailId=id??detailId; render(); }

/* ---------- Events ---------- */
document.addEventListener("click", e=>{
  const qm = e.target.closest(".qm");
  if(qm){ e.stopPropagation(); showHint(qm); return; }
  if(!e.target.closest("#hintpop")) hideHint();
  const gs = e.target.closest("#gameseg button");
  if(gs){
    gameFilter = gs.dataset.game; store.set("tcgx.game", gameFilter);
    document.querySelectorAll("#gameseg button").forEach(b=>b.classList.toggle("on", b.dataset.game===gameFilter));
    buildTicker(); updateIndexPill(); render(); return;
  }
  const nav = e.target.closest(".navbtn"); if(nav){ go(nav.dataset.view, null); return; }
  const gt = e.target.closest("[data-goto]"); if(gt){ go(gt.dataset.goto); return; }
  const w = e.target.closest("[data-watch]"); if(w){ e.stopPropagation(); toggleWatch(w.dataset.watch); return; }
  const dp = e.target.closest("[data-delport]"); if(dp){ const port=store.get("tcgx.port",[]); port.splice(+dp.dataset.delport,1); store.set("tcgx.port",port); render(); return; }
  const ap = e.target.closest("[data-addport]"); if(ap){ go("portfolio"); setTimeout(()=>{ $("#pf-prod").value=ap.dataset.addport; const mp=price(prodOf(ap.dataset.addport)); if(mp!=null) $("#pf-cost").value=Math.round(mp); },0); return; }
  const sim = e.target.closest("[data-sim]"); if(sim){ go("simulator", sim.dataset.sim); setTimeout(runSim,60); return; }
  const row = e.target.closest("tr[data-prod]"); if(row){ go("detail", row.dataset.prod); return; }
  const tag = e.target.closest(".tagchip"); if(tag){ newsTag=tag.dataset.tag||""; render(); return; }
  if(e.target.id==="eng-run") runEngine();
  if(e.target.id==="gr-run") runGrading();
  if(e.target.id==="sim-run") runSim();
  if(e.target.id==="desk-save-prods") deskSaveProducts();
  if(e.target.id==="desk-save-cards") deskSaveCards();
  if(e.target.id==="desk-save-news") deskSaveNews();
  if(e.target.id==="pf-add"){
    const port=store.get("tcgx.port",[]);
    const id=$("#pf-prod").value, qty=+$("#pf-qty").value||1;
    const mp = price(prodOf(id));
    const cost=+$("#pf-cost").value || (mp!=null?Math.round(mp):0);
    if(!cost){ toast("Enter your cost — no recorded market price to assume"); return; }
    port.push({id,qty,cost}); store.set("tcgx.port",port); toast("Position added"); render();
  }
});
document.addEventListener("input", e=>{
  if(e.target.id==="eng-fee") $("#eng-fee-v").textContent = e.target.value+"%";
  if(e.target.id==="eng-gfee") $("#eng-gfee-v").textContent = "$"+e.target.value;
  if(e.target.id==="gr-gem") $("#gr-gem-v").textContent = e.target.value+"%";
  if(e.target.id==="gr-fee") $("#gr-fee-v").textContent = "$"+e.target.value;
  if(e.target.id==="searchbox") doSearch(e.target.value);
});
document.addEventListener("change", e=>{
  if(e.target.id==="sim-prod") updateSimInfo();
  if(e.target.id==="eng-prod") runEngine();
});

/* ---------- Search ---------- */
function doSearch(q){
  const box=$("#searchresults");
  if(!q || q.length<2){ box.classList.remove("open"); return; }
  const ql=q.toLowerCase();
  const hits = PRODUCTS.filter(p => (setOf(p.set).name+" "+p.name+" "+p.id).toLowerCase().includes(ql)).slice(0,8);
  box.innerHTML = hits.length ? hits.map(p=>`<button class="sr-item" data-prod-search="${p.id}">
    <span>${setOf(p.set).name} — ${p.name}</span><span class="m">${fmt(price(p))}</span></button>`).join("")
  : `<div class="sr-item" style="cursor:default"><span class="m">No matches for "${q}"</span></div>`;
  box.classList.add("open");
}
document.addEventListener("click", e=>{
  const s2=e.target.closest("[data-prod-search]");
  if(s2){ $("#searchresults").classList.remove("open"); $("#searchbox").value=""; go("detail", s2.dataset.prodSearch); }
  else if(!e.target.closest(".search")) $("#searchresults").classList.remove("open");
});

/* ---------- Clock + index pill ---------- */
function tickClock(){
  $("#pill-clock").textContent = new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",second:"2-digit"}) + " UTC";
}
setInterval(tickClock,1000); tickClock();
function updateIndexPill(){
  IDX = indexSeries(filtered());
  if(IDX.length<2){ $("#pill-index").textContent = "—"; $("#pill-index-chg").innerHTML=""; return; }
  const idxNow=IDX[IDX.length-1].v, idxD=IDX[IDX.length-2].v;
  $("#pill-index").textContent = idxNow.toFixed(1);
  $("#pill-index-chg").innerHTML = `<span class="${cls(idxNow-idxD)}" style="font-family:var(--mono)">${pct((idxNow/idxD-1)*100)}</span>`;
}

/* ---------- Boot ---------- */
document.querySelectorAll("#gameseg button").forEach(b=>b.classList.toggle("on", b.dataset.game===gameFilter));
buildTicker();
updateIndexPill();
render();
loadLive();
initAuth();

</script>
