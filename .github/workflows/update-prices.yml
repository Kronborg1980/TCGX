# TCGX · Nightly price updater
# Put this file at: .github/workflows/update-prices.yml in your repo
# Add repo secrets (Settings → Secrets → Actions):
#   WORKER_URL  = https://tcgx-api.<your-subdomain>.workers.dev
#   ADMIN_KEY   = the same secret you set on the Worker
#
# Replace the fetch section with a real pricing source when ready
# (pokemontcg.io is free with an API key; or scrape your own sources).

name: Update TCGX prices
on:
  schedule:
    - cron: "0 2 * * *"   # every night at 02:00 UTC
  workflow_dispatch:        # manual "Run workflow" button

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch prices and push to Worker
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          # --- DEMO: nudges yesterday's prices ±2%. Replace with real API calls. ---
          node - <<'EOF'
          const products = ["sv8pt5-etb","sv8pt5-bbdl","sv8pt5-case","sv8-bb","sv8-case",
            "sv3pt5-upc","sv3pt5-bbdl","sv4a-box","sv4a-case","sv7a-box","swsh7-bb",
            "op05-bb","op05-case","op09-bb","eb01-bb"];
          (async () => {
            const cur = await (await fetch(process.env.WORKER_URL + "/api/products")).json();
            const rows = products.map(id => {
              const p = cur.find(x => x.id === id);
              const base = p?.market_price_usd || 100;
              return { item_id: id, market_price_usd: +(base * (1 + (Math.random()-.5)*0.04)).toFixed(2) };
            });
            const r = await fetch(process.env.WORKER_URL + "/api/prices", {
              method: "POST",
              headers: { "Content-Type": "application/json", "Authorization": "Bearer " + process.env.ADMIN_KEY },
              body: JSON.stringify(rows),
            });
            console.log(await r.text());
          })();
          EOF
