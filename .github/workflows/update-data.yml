# TCGX · Nightly REAL data updater
# Path in repo: .github/workflows/update-data.yml (replace the old file entirely)
# Repo secrets: WORKER_URL, ADMIN_KEY, optional POKEMONTCG_API_KEY
#
# 1) Real TCGplayer market prices via pokemontcg.io (with retries — their API 500s intermittently)
# 2) Real headlines via Google News RSS (never bot-blocked; links go to the original articles)

name: Update TCGX real data
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch real card prices + news
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          PTCG_KEY: ${{ secrets.POKEMONTCG_API_KEY }}
        run: |
          node - <<'EOF'
          const W = process.env.WORKER_URL, KEY = process.env.ADMIN_KEY, PT = process.env.PTCG_KEY;
          const H = PT ? { "X-Api-Key": PT } : {};
          const EN_CARDS = [
            { key:"card|sv8pt5|Umbreon ex 161 (SIR)",  q:'set.id:sv8pt5 number:161' },
            { key:"card|sv8pt5|Sylveon ex 156 (SIR)",  q:'set.id:sv8pt5 number:156' },
            { key:"card|sv8pt5|Espeon ex 155 (SIR)",   q:'set.id:sv8pt5 number:155' },
            { key:"card|sv8pt5|Leafeon ex 144 (SIR)",  q:'set.id:sv8pt5 number:144' },
            { key:"card|sv8pt5|Glaceon ex 150 (SIR)",  q:'set.id:sv8pt5 number:150' },
            { key:"card|sv8|Pikachu ex 238 (SIR)",     q:'set.id:sv8 number:238' },
            { key:"card|sv8|Latias ex 239 (SIR)",      q:'set.id:sv8 number:239' },
            { key:"card|sv8|Milotic ex 237 (SIR)",     q:'set.id:sv8 number:237' },
            { key:"card|sv3pt5|Charizard ex 199 (SIR)",q:'set.id:sv3pt5 number:199' },
            { key:"card|swsh7|Umbreon VMAX (Moonbreon)", q:'set.id:swsh7 name:"Umbreon VMAX"', pickMax:true },
            { key:"card|swsh7|Rayquaza VMAX alt",        q:'set.id:swsh7 name:"Rayquaza VMAX"', pickMax:true },
            { key:"card|swsh7|Sylveon VMAX alt",         q:'set.id:swsh7 name:"Sylveon VMAX"',  pickMax:true },
          ];
          const bestMarket = card => {
            const pr = card?.tcgplayer?.prices || {};
            const vals = Object.values(pr).map(x => x?.market).filter(v => typeof v === "number" && v > 0);
            return vals.length ? Math.max(...vals) : null;
          };
          const getJSON = async (url, tries) => {
            for (let i = 0; i < tries; i++) {
              try {
                const r = await fetch(url, { headers: H });
                if (r.ok) return await r.json();
                console.log("  retry (" + r.status + ") attempt " + (i+1));
              } catch (e) { console.log("  retry (err " + e.message + ") attempt " + (i+1)); }
              await new Promise(res => setTimeout(res, 1500 * (i + 1)));
            }
            return null;
          };
          const decode = s => s.replace(/&amp;/g,"&").replace(/&#39;/g,"'").replace(/&quot;/g,'"').replace(/&lt;/g,"<").replace(/&gt;/g,">");
          (async () => {
            // ---- 1) real card prices (with retries) ----
            const rows = [];
            for (const c of EN_CARDS) {
              const data = await getJSON("https://api.pokemontcg.io/v2/cards?q=" + encodeURIComponent(c.q), 4);
              const list = data?.data || [];
              if (!list.length) { console.log("MISS", c.key); continue; }
              let price;
              if (c.pickMax) {
                const vals = list.map(bestMarket).filter(v => v != null);
                price = vals.length ? Math.max(...vals) : null;
              } else price = bestMarket(list[0]);
              if (price != null) { rows.push({ item_id: c.key, market_price_usd: +price.toFixed(2) }); console.log("OK", c.key, price); }
              else console.log("MISS (no market price)", c.key);
              await new Promise(res => setTimeout(res, 400));
            }
            if (rows.length) {
              const r = await fetch(W + "/api/prices", { method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": "Bearer " + KEY },
                body: JSON.stringify(rows) });
              console.log("prices saved:", await r.text());
            } else console.log("No card prices fetched — nothing written.");

            // ---- 2) real news via Google News RSS (real articles, real links) ----
            const feeds = [
              { url: "https://news.google.com/rss/search?q=%22pokemon%20tcg%22&hl=en-US&gl=US&ceid=US:en", tag: "Pokémon" },
              { url: "https://news.google.com/rss/search?q=%22one%20piece%20card%20game%22&hl=en-US&gl=US&ceid=US:en", tag: "One Piece" },
            ];
            for (const f of feeds) {
              try {
                const res = await fetch(f.url, { headers: { "User-Agent": "Mozilla/5.0 (TCGX price bot)" } });
                const xml = await res.text();
                const items = [...xml.matchAll(/<item>([\s\S]*?)<\/item>/g)].slice(0, 4).map(m => {
                  const g = tag => {
                    const mm = m[1].match(new RegExp("<" + tag + ">(?:<!\\[CDATA\\[)?([\\s\\S]*?)(?:\\]\\]>)?<\\/" + tag + ">"));
                    return mm ? mm[1].trim() : "";
                  };
                  return { title: decode(g("title")), url: g("link") };
                }).filter(x => x.title && x.url);
                console.log(f.tag + " feed: " + items.length + " articles found");
                for (const it of items) {
                  const r = await fetch(W + "/api/news", { method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + KEY },
                    body: JSON.stringify({ title: it.title, url: it.url, body: "", tags: f.tag + ", News" }) });
                  console.log("news:", it.title.slice(0, 70), await r.text());
                }
              } catch (e) { console.log("FEED ERR", f.tag, e.message); }
            }
          })();
          EOF
